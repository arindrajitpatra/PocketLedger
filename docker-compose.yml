version: '3.8'

services:
  web:
    build: .
    container_name: pocketledger_web
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://pocketuser:pocketpass@db:5432/pocketledger
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: pocketledger_db
    environment:
      POSTGRES_USER: pocketuser
      POSTGRES_PASSWORD: pocketpass
      POSTGRES_DB: pocketledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketuser -d pocketledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
