name: PocketLedger CI/CD Pipeline

on: [push, pull_request]

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python syntax
        run: |
          python -m compileall app tests

      - name: Run Ruff
        run: |
          ruff check app tests

  test:
    name: Run Automated Tests & Health Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketuser
          POSTGRES_PASSWORD: pocketpass
          POSTGRES_DB: pocketledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://pocketuser:pocketpass@localhost:5432/pocketledger_test
        run: |
          python -m pytest
